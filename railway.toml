# NOTE: Railway only applies this file when "Config as Code" is enabled for the service.
# The Dockerfile CMD (python -m app.entrypoint) is the authoritative start command either way.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# /live is a pure liveness probe (does not need the database); /health is the readiness report.
healthcheckPath = "/live"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
